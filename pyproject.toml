[project]
name = "multiagent-wedding-planner"
version = "0.1.0"
description = "Multi-agent wedding planner using LangChain and Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=1.3.0",
    "langchain-groq>=1.1.0",
    "streamlit>=1.40.0",
    "tavily-python>=0.5.0",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
